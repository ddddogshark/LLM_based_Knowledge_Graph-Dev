[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kg-builder"
version = "0.1.0"
description = "LLM-based multi-agent pipeline for automatic knowledge graph construction from course materials"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ddddogshark", email = "ddddogshark@github.com"}
]
keywords = ["knowledge-graph", "llm", "neo4j", "multi-agent", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pyautogen>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "neo4j>=5.0.0",
    "mysql-connector-python>=8.0.0",
    "redis>=4.0.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/ddddogshark/LLM_based_Knowledge_Graph-Dev"
Repository = "https://github.com/ddddogshark/LLM_based_Knowledge_Graph-Dev"
"Issue Tracker" = "https://github.com/ddddogshark/LLM_based_Knowledge_Graph-Dev/issues"

[tool.setuptools.packages.find]
where = ["."]
